services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nmmba
      POSTGRES_PASSWORD: nmmba
      POSTGRES_DB: nmmba
    ports:
      - "54329:5432"
    volumes:
      - nmmba-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmmba -d nmmba"]
      interval: 3s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "43125"
      DATABASE_URL: postgres://nmmba:nmmba@db:5432/nmmba
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      ALLOW_GROUP_OVERRIDE: "1"
    ports:
      - "43125:43125"
volumes:
  nmmba-pg:
